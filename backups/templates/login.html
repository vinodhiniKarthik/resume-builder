<!DOCTYPE html>
<html>
<body>

<h2>Login</h2>
<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<form method="POST">
    {{ form.hidden_tag() }}

    <p>
        {{ form.email.label }}<br>
        {{ form.email() }}
    </p>

    <p>
        {{ form.password.label }}<br>
        {{ form.password() }}
    </p>

    <p>
        {{ form.submit() }}
    </p>
</form>

{% for field, errors in form.errors.items() %}
    {% for error in errors %}
        <p style="color:red">{{ error }}</p>
    {% endfor %}
{% endfor %}

</body>
</html>

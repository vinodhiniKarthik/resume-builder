<!DOCTYPE html>
<html>
<head>
    <title>Resume Builder</title>
    <link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<h1>Create Your Resume</h1>

<form method="POST">

    <input type="text" name="full_name" placeholder="Full Name"><br><br>

    <input type="email" name="email" placeholder="Email"><br><br>

    <input type="text" name="phone" placeholder="Phone"><br><br>

    <textarea name="skills" placeholder="Skills"></textarea><br><br>

    <textarea name="education" placeholder="Education"></textarea><br><br>

    <textarea name="experience" placeholder="Experience"></textarea><br><br>

    <button type="submit">Save Resume</button>

</form>

</body>
</html>
